[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inferpico-check"
version = "0.2.0"
description = "Local-first LLM full-response latency and estimated cost checks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/newsbruno/inferpico"
Issues = "https://github.com/newsbruno/inferpico/issues"
Changelog = "https://github.com/newsbruno/inferpico/blob/main/CHANGELOG.md"

[project.scripts]
inferpico = "inferpico:main"

[tool.setuptools]
py-modules = ["inferpico"]
packages = ["web"]
include-package-data = true

[tool.setuptools.package-data]
web = ["*.html", "*.js", "*.css", "*.svg"]
